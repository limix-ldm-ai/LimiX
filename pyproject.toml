[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "LimiX"
version = "2.0.0"
description = "LimiX tabular foundation model inference"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE.txt" }
dependencies = [
    "torch>=2.9.1",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "einops",
    "kditransform",
    "nvtx",
    "packaging",
    "typing_extensions",
    "tqdm",
    "joblib",
]

[project.optional-dependencies]
# MLX backend (limix_mlx): Apple silicon only. The markers make
# `pip install LimiX[mlx]` a no-op elsewhere instead of a resolution error.
mlx = [
    "mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
LimiX-infer = "infer:main"

[tool.setuptools]
py-modules = ["infer"]
include-package-data = false
license-files = ["LICENSE.txt"]

[tool.setuptools.packages.find]
include = ["inference*", "model*", "utils*", "limix*", "config*"]
exclude = ["build*", "*.egg-info*", "*.__pycache__*"]
namespaces = false

[tool.setuptools.package-data]
config = ["*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "*__pycache__*"]
